server:
  port: 8080

debug: false

spring:
  application:
    name: rag-elasticsearch
  config:
    import:
      - optional:classpath:config/dev/application-memory-dev.yml
  ai:
    openai:
      chat:
        api-key: "sk-vcqgdvzbcchptznjpgcsyrfzrclvuvsidsrdpoyadgzgmtpg"   # 可独立设置生成模型的API密钥
        base-url: https://api.siliconflow.cn   # 可改为生成模型专属域名
        options:
          model: Pro/deepseek-ai/DeepSeek-V3.1-Terminus
          timeout: 60s        # 增加超时时间到60秒
          max-retries: 3
          temperature: 0.7
          max-tokens: 2048
      embedding:
        api-key: "sk-vcqgdvzbcchptznjpgcsyrfzrclvuvsidsrdpoyadgzgmtpg"   # 可独立设置嵌入模型的API密钥
        base-url: https://api.siliconflow.cn   # 可改为嵌入模型专属域名
        options:
          model: BAAI/bge-large-zh-v1.5
          timeout: 60s        # 嵌入模型超时时间
          max-retries: 5      # 嵌入模型重试次数

    # vectorstore.elasticsearch 配置已废弃，统一改为 retrieval.vector

    retrieval:
      vector:
        index-name: customer_support_qa_ik
        similarity: cosine
        dimensions: 1024


    rag:
      query-rewrite:
        enabled: false  # 启用查询重写功能
      retriever:
        type: vector  # 可选值: hybrid, vector, bm25（验证内存保留时避免外部嵌入依赖）
      hybrid:
        top-k: 5
        rrf-k: 60
        weight:
          bm25: 1.0
          vector: 1.0
      bm25:
        top-n: 5
        boost: 1.2
        k1: 1.2
        b: 0.75
      vector:
        top-k: 5
        similarity-threshold: 0.85
      reranker:
        enabled: true
        endpoint: https://api.siliconflow.cn/v1/rerank
        model: BAAI/bge-reranker-v2-m3
        timeout-ms: 3000
        api-key: "sk-vcqgdvzbcchptznjpgcsyrfzrclvuvsidsrdpoyadgzgmtpg"

  elasticsearch:
    uris: http://127.0.0.1:9200
    username: elastic
    password: yingzi

app:
  dev-tests:
    enabled: false    # 禁用启动时自动执行的测试
  
  # 知识库初始化配置
  knowledge-base:
    init-data: true      # 知识库数据初始化
    clear-existing: true # 清除现有数据
    load-excel: true     # Excel数据加载
  

  
  # 安全配置
  security:
    input-check:
      enabled: false  # 启用输入安全检查
    output-check:
      enabled: false  # 启用输出安全检查

management:
  tracing:
    enabled: false        # 完全关闭链路追踪，节省资源
