server:
  port: 8080

spring:
  config:
    import:
      - optional:classpath:config/prod/application-mcp-prod.yml
      - optional:classpath:config/prod/application-memory-prod.yml
      - optional:classpath:config/prod/application-langfuse-prod.yml
  ai:
    chat:
      client:
        observations:
          log-prompt: false    # 禁用Spring AI内置提示日志，使用自定义日志
    models:
      chat:
        api-key: sk-dae20e2b5ec340a3bd0de1cc476c2894
        base-url: https://dashscope.aliyuncs.com/compatible-mode
        model: qwen-max
        temperature: 0.7
        max-tokens: 2048
      embedding:
        api-key: "sk-vcqgdvzbcchptznjpgcsyrfzrclvuvsidsrdpoyadgzgmtpg"
        base-url: https://api.siliconflow.cn/v1
        model: text-embedding-v1
      reranker:
        enabled: true
        endpoint: https://api.siliconflow.cn/v1/rerank
        model: BAAI/bge-reranker-v2-m3
        timeout-ms: 3000
        api-key: "sk-vcqgdvzbcchptznjpgcsyrfzrclvuvsidsrdpoyadgzgmtpg"
    retrieval:
      vector:
        index-name: customer_support_qa
        similarity: cosine
        dimensions: 1024
        top-k: 5
        similarity-threshold: 0.75
      hybrid:
        top-k: 5
        rrf-k: 60
        weight:
          bm25: 1.0
          vector: 1.0

  elasticsearch:
    uris: http://127.0.0.1:9200
    username: elastic
    password: yingzi

app:
  # RAG配置
  rag:
    query-rewrite:
      enabled: true  # 启用查询重写功能
  
  # 安全配置（生产环境更严格）
  security:
    input-check:
      enabled: true  # 启用输入安全检查
    output-check:
      enabled: true  # 启用输出安全检查
