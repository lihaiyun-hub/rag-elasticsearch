# 测试环境配置
spring.application.name=rag-elasticsearch-test

# 日志配置
logging.level.com.example.ragelasticsearch=DEBUG
logging.level.org.springframework.ai=DEBUG

# 测试用Spring AI配置（使用模拟值）
spring.ai.openai.api-key=test-api-key
spring.ai.openai.base-url=http://localhost:8080/mock
spring.ai.openai.chat.options.model=gpt-3.5-turbo
spring.ai.openai.embedding.options.model=text-embedding-ada-002

# 测试用Elasticsearch配置
spring.elasticsearch.uris=http://localhost:9200
spring.ai.vectorstore.elasticsearch.index-name=customer_support_qa
spring.ai.vectorstore.elasticsearch.similarity=cosine
spring.ai.vectorstore.elasticsearch.dimensions=1536

# 基础RAG测试配置

# 测试用重排序配置
app.rag.reranker.enabled=false
app.rag.reranker.endpoint=http://localhost:8080/mock-rerank
app.rag.reranker.model=test-rerank-model
app.rag.reranker.api-key=test-rerank-key